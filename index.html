<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çarpma İşlemi Ödev Oluşturucu</title>
    <style>
        /* Tüm HTML elementlerinin varsayılan margin, padding ve box-sizing değerlerini sıfırlama */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
        }

       /* ✅ Menü butonu */
#menuToggle {
    position: absolute;
    top: 20px;
    left: 20px;
    background: #667eea;
    color: white;
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 50%; /* Tam daire */
    font-size: 18px;
    cursor: pointer;
    z-index: 1001;
    transition: opacity 0.3s ease;

    /* İçerik ortalamak ve şekil bozulmasını engellemek için: */
    display: flex;
    align-items: center;
    justify-content: center;

    /* Ekstra koruma: */
    padding: 0;
    margin: 0;
    box-sizing: border-box;
    line-height: 1;
    overflow: hidden; /* Gerekirse */
}

        /* Menü açıkken butonu gizle */
        .container.menu-open #menuToggle {
            opacity: 0;
            pointer-events: none;
        }

        /* ✅ Drawer Menü */
        #drawerMenu {
            position: fixed;
            top: 0;
            left: -100%;
            width: auto;
            min-width: 280px;
            max-width: 90vw;
            height: 100vh;
            background: white;
            box-shadow: 5px 0 15px rgba(0, 0, 0, 0.2);
            padding: 20px;
            overflow-y: auto;
            transition: left 0.3s ease;
            z-index: 1000;
        }

        #drawerMenu.open {
            left: 0;
        }

        /* ✅ Overlay */
        #menuOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 999;
        }

        #menuOverlay.active {
            display: block;
        }

        /* Diğer stiller */
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .settings {
            display: grid;
            gap: 25px;
            margin-bottom: 30px;
        }

        .multiplier-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #e0e0e0;
        }

        .multiplier-section h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .setting-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            color: #333;
            font-size: 1em;
        }

        select,
        input,
        textarea {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s;
        }

        select:focus,
        input:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .help-text {
            font-size: 0.85em;
            color: #666;
            margin-top: 5px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.3em;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .homework-pages {
            display: none;
            margin-top: 30px;
        }

        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }

            .container {
                box-shadow: none;
                padding: 0;
                max-width: 100%;
                margin: 0;
            }

            .settings,
            button,
            h1,
            #menuToggle {
                display: none !important;
            }

            .homework-pages {
                display: block !important;
            }

            .page {
                padding: 10mm 15mm;
                page-break-after: always;
                height: 100vh;
            }

            .page:last-child {
                page-break-after: auto;
            }

            .print-button {
                display: none !important;
            }
        }

        .page {
            background: white;
            padding: 30px;
            margin-bottom: 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #000;
            padding-bottom: 6px;
            margin-bottom: 15px;
        }

        .page-header .name-field {
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
            color: #666;
            letter-spacing: 0.5px;
        }

        .page-header .title {
            font-family: 'Segoe UI', sans-serif;
            font-size: 13px;
            color: #000;
        }

        .questions {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 27px 20px;
        }

        .question {
            position: relative;
            font-family: Arial, sans-serif;
        }

        .question-number {
            position: absolute;
            top: -2px;
            left: 10px;
            font-size: 10px;
            color: #999;
        }

        .multiplication-content {
            text-align: right;
            font-size: 16px;
            line-height: 1.4;
            padding-right: 5px;
        }

        .first-number {
            color: #000;
            margin-bottom: 0px;
        }

        .second-number {
            color: #ff6b6b;
            margin-bottom: 1px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 0px;
            border-bottom: 2px solid #000;
            width: 80px;
            margin-left: auto;
        }

        .second-number::before {
            content: '×';
            margin-right: 50px;
            color: #000;
        }

        .dashed-box,
        .dashed-box-blue {
            border: 1.5px dashed;
            background: #fff;
            min-height: 20px;
            margin: 2px 0;
            border-radius: 2px;
            width: 80px;
            margin-left: auto;
        }

        .dashed-box {
            border-color: #ff8566;
        }

        .dashed-box-blue {
            border-color: #6b9bd1;
        }

        .plus-line {
            position: relative;
            min-height: 22px;
            margin: 3px 0;
            margin-top: -8px;
        }

        .plus-line::before {
            content: '+';
            position: absolute;
            left: 0px;
            top: -11px;
            font-size: 14px;
            color: #000;
        }

        .plus-line::after {
            content: '';
            position: absolute;
            bottom: 11px;
            left: 0;
            right: 0;
            border-bottom: 2px solid #000;
        }

        .print-button {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            margin-top: 20px;
        }

        .print-button:hover {
            box-shadow: 0 10px 20px rgba(40, 167, 69, 0.3);
        }

        textarea {
            text-align: center;
            resize: vertical;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s;
        }
    </style>
</head>

<body>
    <!-- Ana içerik -->
    <div class="container" id="mainContainer">
        <button id="menuToggle">☰</button>
        <h1>📝 Çarpma İşlemi Ödev Oluşturucu</h1>
        <div class="homework-pages" id="homeworkPages"></div>
    </div>

    <!-- Drawer Menü -->
    <div id="drawerMenu">
        <div class="settings">
            <!-- 1. Çarpan -->
            <div class="multiplier-section">
                <h3>🔢 1. Çarpan Ayarları</h3>
                <div class="setting-row">
                    <div class="setting-group">
                        <label for="digits1">Basamak Sayısı:</label>
                        <select id="digits1">
                            <option value="1">1 Basamak</option>
                            <option value="2" selected>2 Basamak</option>
                            <option value="3">3 Basamak</option>
                            <option value="4">4 Basamak</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label for="maxDigit1">Basamaklardaki Maksimum Rakam:</label>
                        <select id="maxDigit1">
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9" selected>9</option>
                        </select>
                        <div class="help-text">Her basamaktaki rakam en fazla bu değer olabilir</div>
                    </div>
                </div>
            </div>

            <!-- 2. Çarpan -->
            <div class="multiplier-section">
                <h3>🔢 2. Çarpan Ayarları</h3>
                <div class="setting-row">
                    <div class="setting-group">
                        <label for="digits2">Basamak Sayısı:</label>
                        <select id="digits2">
                            <option value="1">1 Basamak</option>
                            <option value="2" selected>2 Basamak</option>
                            <option value="3">3 Basamak</option>
                            <option value="4">4 Basamak</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label for="maxDigit2">Basamaklardaki Maksimum Rakam:</label>
                        <select id="maxDigit2">
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9" selected>9</option>
                        </select>
                        <div class="help-text">Her basamaktaki rakam en fazla bu değer olabilir</div>
                    </div>
                </div>
            </div>

            <!-- Genel Ayarlar -->
            <div class="multiplier-section">
                <h3>⚙️ Genel Ayarlar</h3>
                <div class="setting-row">
                    <div class="setting-group">
                        <label for="homeworkTitle">Ödev Başlığı:</label>
                        <input type="text" id="homeworkTitle" value="Çarpma işlemlerini dikkatlice yap." placeholder="Ödev başlığı girin">
                    </div>
                    <div class="setting-group">
                        <label for="nameField">Sol Üst Yazı:</label>
                        <input type="text" id="nameField" value="Adı Soyadı:" placeholder="Sol üst yazı">
                    </div>
                    <div class="setting-group">
                        <label for="ogretmen">Öğretmen:</label>
                        <textarea id="ogretmen" placeholder="Öğretmen" rows="2">Osman Türkmen
3/4-A Sınıf Öğretmeni</textarea>
                        <div class="help-text">İki satır kullanabilirsiniz. İlk satır: Ad, İkinci satır: Sınıf vb.</div>
                    </div>
                    <div class="setting-group">
                        <label for="tarih">Tarih:</label>
                        <input type="text" id="tarih" value="" placeholder="Tarih">
                    </div>
                </div>
            </div>

            <button onclick="generateHomework()">🎯 Ödev Oluştur</button>
        </div>
    </div>

    <!-- Overlay -->
    <div id="menuOverlay"></div>

    <script>
        // Menü aç/kapa mantığı
        const menuToggle = document.getElementById('menuToggle');
        const drawerMenu = document.getElementById('drawerMenu');
        const menuOverlay = document.getElementById('menuOverlay');
        const mainContainer = document.getElementById('mainContainer');

        menuToggle.addEventListener('click', function () {
            drawerMenu.classList.add('open');
            menuOverlay.classList.add('active');
            mainContainer.classList.add('menu-open');
        });

        menuOverlay.addEventListener('click', function () {
            drawerMenu.classList.remove('open');
            menuOverlay.classList.remove('active');
            mainContainer.classList.remove('menu-open');
        });

        function generateHomework() {
            const digits1 = parseInt(document.getElementById('digits1').value);
            const maxDigit1 = parseInt(document.getElementById('maxDigit1').value);
            const digits2 = parseInt(document.getElementById('digits2').value);
            const maxDigit2 = parseInt(document.getElementById('maxDigit2').value);
            const title = document.getElementById('homeworkTitle').value || 'Çarpma işlemlerini dikkatlice yap.';
            const nameField = document.getElementById('nameField').value || 'ADI SOYADI:';
            const ogretmenRaw = document.getElementById('ogretmen').value || 'Öğretmen:';
            const tarih = document.getElementById('tarih').value || new Date().toLocaleDateString('tr-TR');

            const homeworkPages = document.getElementById('homeworkPages');
            homeworkPages.innerHTML = '';

            const questionsPerPage = 84;
            const pageDiv = document.createElement('div');
            pageDiv.className = 'page';

            const header = `
                <div class="page-header">
                    <div class="name-field">${nameField}</div>
                    <div class="title">${title}</div>
                </div>
            `;
            pageDiv.innerHTML = header;

            const questionsDiv = document.createElement('div');
            questionsDiv.className = 'questions';
            for (let i = 1; i <= questionsPerPage; i++) {
                const num1 = generateNumberWithDigitLimit(digits1, maxDigit1);
                const num2 = generateNumberWithDigitLimit(digits2, maxDigit2);
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question';
                questionDiv.innerHTML = `
                    <div class="question-number">${i}.</div>
                    <div class="multiplication-content">
                        <div class="first-number">${num1}</div>
                        <div class="second-number">${num2}</div>
                        <div class="dashed-box"></div>
                        <div class="dashed-box-blue"></div>
                        <div class="plus-line"></div>
                    </div>
                `;
                questionsDiv.appendChild(questionDiv);
            }
            pageDiv.appendChild(questionsDiv);

            // Footer: Tarih (sol), Öğretmen (sağ, iki satır, ortalanmış)
            const footer = document.createElement('div');
            footer.style.marginTop = '40px';
            footer.style.paddingTop = '10px';
            footer.style.borderTop = '1px dashed #ccc';
            footer.style.fontSize = '14px';
            footer.style.color = '#555';
            footer.style.display = 'flex';
            footer.style.justifyContent = 'space-between';
            footer.style.alignItems = 'flex-start';

            const tarihDiv = document.createElement('div');
            tarihDiv.innerHTML = `<strong>Tarih:</strong> ${tarih}`;

            const ogretmenDiv = document.createElement('div');
            ogretmenDiv.style.textAlign = 'center';
            ogretmenDiv.style.whiteSpace = 'pre-line';
            ogretmenDiv.textContent = ogretmenRaw;
            ogretmenDiv.style.fontWeight = 'bold';

            footer.appendChild(tarihDiv);
            footer.appendChild(ogretmenDiv);
            pageDiv.appendChild(footer);

            homeworkPages.appendChild(pageDiv);

            const printButton = document.createElement('button');
            printButton.className = 'print-button';
            printButton.textContent = '🖨️ Ödevi Yazdır';
            printButton.onclick = () => window.print();
            homeworkPages.appendChild(printButton);

            homeworkPages.style.display = 'block';
            homeworkPages.scrollIntoView({ behavior: 'smooth' });

            // Menüyü kapat
            drawerMenu.classList.remove('open');
            menuOverlay.classList.remove('active');
            mainContainer.classList.remove('menu-open');
        }

        function generateNumberWithDigitLimit(digitCount, maxDigitValue) {
            let number = '';
            for (let i = 0; i < digitCount; i++) {
                let digit;
                if (i === 0) {
                    if (digitCount === 1) {
                        digit = Math.floor(Math.random() * (maxDigitValue + 1));
                    } else {
                        digit = Math.floor(Math.random() * maxDigitValue) + 1;
                    }
                } else {
                    digit = Math.floor(Math.random() * (maxDigitValue + 1));
                }
                number += digit;
            }
            return parseInt(number);
        }
    </script>
</body>

</html>
